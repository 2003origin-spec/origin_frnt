<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>You're offline · ORIGIN</title>
<!--
  Precached service-worker navigation fallback (ANDROID_HYBRID_APP_PLAN.md
  §6.3). Must render with ZERO network: no external fonts, styles, scripts or
  images — everything inline. Served for any page navigation that fails while
  offline and has no cached copy.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
  }
  .wrap { max-width: 26rem; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 28px;
    border: 2px solid rgba(255, 255, 255, 0.9); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; letter-spacing: -1px;
  }
  .brand { font-size: 15px; font-weight: 700; letter-spacing: 0.35em; text-transform: uppercase; opacity: 0.6; margin-bottom: 14px; }
  h1 { font-size: 30px; font-weight: 800; line-height: 1.15; margin-bottom: 12px; }
  p { font-size: 16px; line-height: 1.5; color: rgba(255, 255, 255, 0.65); margin-bottom: 30px; }
  button {
    appearance: none; border: 0; cursor: pointer;
    background: #fff; color: #000;
    font: inherit; font-size: 16px; font-weight: 700;
    padding: 14px 34px; border-radius: 999px;
    min-width: 11rem; min-height: 48px;
  }
  button:active { transform: scale(0.98); }
  .hint { font-size: 13px; color: rgba(255, 255, 255, 0.4); margin: 22px 0 0; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="mark" aria-hidden="true">O₃</div>
    <div class="brand">Origin</div>
    <h1>You&rsquo;re offline</h1>
    <p>This page isn&rsquo;t saved on your device yet. Reconnect to the internet and try again &mdash; pages you visit while online stay readable here without a connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="hint">Reconnects automatically when your network is back.</p>
  </main>
  <script>
    // The moment connectivity returns, retry the original destination.
    addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
